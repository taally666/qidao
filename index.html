<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>转载奇刀君</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>转载奇刀君</h1>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索..." inputmode="search">
            <select id="categorySelect" class="category-select">
                <option value="">全部</option>
            </select>
        </div>

        <div id="audioList" class="audio-list"></div>
    </div>

    <!-- 底部迷你播放器 -->
    <div class="mini-player" id="miniPlayer">
        <img class="mp-cover" id="mpCover" src="" alt="">
        <div class="mp-info">
            <div class="mp-title" id="mpTitle">—</div>
            <div class="mp-progress-row">
                <div class="mp-progress-wrap" id="mpProgressWrap">
                    <div class="mp-progress-bar" id="mpProgressBar"></div>
                </div>
                <div class="mp-time" id="mpTime">0:00 / 0:00</div>
            </div>
        </div>
        <button class="mp-btn mp-speed" id="mpSpeedBtn" aria-label="播放速度">1x</button>
        <button class="mp-btn mp-play" id="mpPlayBtn" aria-label="播放/暂停"></button>
        <button class="mp-btn mp-close" id="mpCloseBtn" aria-label="关闭"></button>
    </div>

    <script>
        // ========== 全局状态 ==========
        let allAudios = [];
        let currentIndex = -1;
        const audio = new Audio();
        audio.preload = 'none';

        const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
        let speedIndex = 0;

        // ========== DOM 引用 ==========
        const audioListEl = document.getElementById('audioList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const miniPlayer = document.getElementById('miniPlayer');
        const mpCover = document.getElementById('mpCover');
        const mpTitle = document.getElementById('mpTitle');
        const mpProgressWrap = document.getElementById('mpProgressWrap');
        const mpProgressBar = document.getElementById('mpProgressBar');
        const mpTime = document.getElementById('mpTime');
        const mpSpeedBtn = document.getElementById('mpSpeedBtn');
        const mpPlayBtn = document.getElementById('mpPlayBtn');
        const mpCloseBtn = document.getElementById('mpCloseBtn');

        // ========== SVG 图标 ==========
        const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
        const ICON_CLOSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

        mpPlayBtn.innerHTML = ICON_PLAY;
        mpCloseBtn.innerHTML = ICON_CLOSE;

        // ========== 工具函数 ==========
        function formatTime(sec) {
            if (sec == null || isNaN(sec) || !isFinite(sec) || sec < 0) return '0:00';
            const total = Math.floor(sec);
            const s = total % 60;
            const m = Math.floor(total / 60) % 60;
            const h = Math.floor(total / 3600);
            if (h > 0) {
                return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
            return m + ':' + String(s).padStart(2, '0');
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ========== 数据合并 ==========
        function normalizeData(raw) {
            const defaults = raw.defaults || {};
            const categories = raw.categories || {};
            const audios = raw.audios || [];

            return audios.map(item => {
                const catMeta = categories[item.category] || {};
                return {
                    title: item.title || '',
                    url: item.url || '',
                    category: item.category || '',
                    cover: item.cover || catMeta.cover || defaults.cover || ''
                };
            });
        }

        // ========== 加载数据 ==========
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                const raw = await response.json();
                allAudios = normalizeData(raw);
                renderAudios(allAudios);
                populateCategories(allAudios);
            } catch (error) {
                audioListEl.innerHTML = `<div class="empty-message">⚠️ 数据加载失败，请确保 data.json 与 index.html 在同一目录下。</div>`;
                console.error(error);
            }
        }

        // ========== 渲染列表 ==========
        function renderAudios(audios) {
            if (audios.length === 0) {
                audioListEl.innerHTML = `<div class="empty-message">🔍 没有找到匹配的音频</div>`;
                return;
            }

            audioListEl.innerHTML = audios.map((item, i) => {
                const idx = allAudios.indexOf(item);
                return `
                    <div class="audio-card" data-idx="${idx}">
                        <span class="audio-index">${i + 1}</span>
                        <div class="audio-title">${escapeHtml(item.title)}</div>
                        ${item.category ? `<span class="audio-category">${escapeHtml(item.category)}</span>` : ''}
                    </div>
                `;
            }).join('');

            updateCardHighlight();
        }

        // ========== 填充分类下拉框 ==========
        function populateCategories(audios) {
            const categories = [...new Set(audios.map(item => item.category).filter(Boolean))];
            categorySelect.innerHTML = '<option value="">全部</option>' +
                categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
        }

        // ========== 搜索 + 分类筛选 ==========
        function applyFilter() {
            const keyword = searchInput.value.toLowerCase().trim();
            const cat = categorySelect.value;

            const filtered = allAudios.filter(item => {
                const titleMatch = item.title.toLowerCase().includes(keyword);
                const catOk = !cat || item.category === cat;
                const keywordOk = !keyword || titleMatch;
                return keywordOk && catOk;
            });

            renderAudios(filtered);
        }

        // ========== 卡片高亮 ==========
        function updateCardHighlight() {
            document.querySelectorAll('.audio-card').forEach(card => {
                const idx = parseInt(card.dataset.idx, 10);
                card.classList.toggle('playing', idx === currentIndex);
            });
        }

        // ========== 切换播放 ==========
        function togglePlay(idx) {
            const item = allAudios[idx];
            if (!item) return;

            if (idx === currentIndex) {
                if (audio.paused) {
                    audio.play().catch(console.error);
                } else {
                    audio.pause();
                }
                return;
            }

            currentIndex = idx;
            audio.src = item.url;
            applySpeed();
            audio.play().catch(err => {
                console.error('播放失败:', err);
                mpTitle.textContent = '播放失败：' + item.title;
            });
            updateMiniPlayer(item);
            updateCardHighlight();
        }

        // ========== 应用倍速 ==========
        function applySpeed() {
            const rate = SPEEDS[speedIndex];
            audio.playbackRate = rate;
            audio.defaultPlaybackRate = rate;
        }

        function updateSpeedBtn() {
            const rate = SPEEDS[speedIndex];
            mpSpeedBtn.textContent = rate + 'x';
            mpSpeedBtn.classList.toggle('active', rate !== 1);
        }

        // ========== 更新迷你播放器 ==========
        function updateMiniPlayer(item) {
            if (item.cover) {
                mpCover.src = item.cover;
                mpCover.style.display = '';
            } else {
                mpCover.style.display = 'none';
            }
            mpTitle.textContent = item.title || '—';
            mpProgressBar.style.width = '0%';
            mpTime.textContent = '0:00 / 0:00';
            miniPlayer.classList.add('active');
        }

        // ========== 时长显示 ==========
        function updateTimeDisplay() {
            const cur = formatTime(audio.currentTime);
            const total = (audio.duration && isFinite(audio.duration)) ? formatTime(audio.duration) : '--:--';
            mpTime.textContent = cur + ' / ' + total;
        }

        // ========== 关闭播放器 ==========
        function closePlayer() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            currentIndex = -1;
            miniPlayer.classList.remove('active');
            updateCardHighlight();
        }

        // ========== 事件绑定 ==========
        audioListEl.addEventListener('click', (e) => {
            const card = e.target.closest('.audio-card');
            if (!card) return;
            const idx = parseInt(card.dataset.idx, 10);
            togglePlay(idx);
        });

        mpPlayBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play().catch(console.error);
            } else {
                audio.pause();
            }
        });

        mpCloseBtn.addEventListener('click', closePlayer);

        mpSpeedBtn.addEventListener('click', () => {
            speedIndex = (speedIndex + 1) % SPEEDS.length;
            applySpeed();
            updateSpeedBtn();
        });

        mpProgressWrap.addEventListener('click', (e) => {
            if (!audio.duration || !isFinite(audio.duration)) return;
            const rect = mpProgressWrap.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = pct * audio.duration;
        });

        audio.addEventListener('play', () => {
            mpPlayBtn.innerHTML = ICON_PAUSE;
        });

        audio.addEventListener('pause', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && isFinite(audio.duration)) {
                const pct = (audio.currentTime / audio.duration) * 100;
                mpProgressBar.style.width = pct + '%';
            }
            updateTimeDisplay();
        });

        audio.addEventListener('loadedmetadata', updateTimeDisplay);
        audio.addEventListener('durationchange', updateTimeDisplay);

        audio.addEventListener('ended', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
            mpProgressBar.style.width = '0%';
        });

        audio.addEventListener('error', () => {
            console.error('音频加载失败');
            mpTime.textContent = '0:00 / --:--';
        });

        searchInput.addEventListener('input', applyFilter);
        categorySelect.addEventListener('change', applyFilter);

        updateSpeedBtn();
        loadData();
    </script>
</body>
</html>
