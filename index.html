<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>转载奇刀君</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>转载奇刀君</h1>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索..." inputmode="search">
            <select id="categorySelect" class="category-select">
                <option value="">全部</option>
            </select>
        </div>

        <div id="audioList" class="audio-list"></div>
    </div>

    <!-- 底部迷你播放器 -->
    <div class="mini-player" id="miniPlayer">
        <img class="mp-cover" id="mpCover" src="" alt="">
        <button class="mp-btn mp-play" id="mpPlayBtn" aria-label="播放/暂停"></button>
        <div class="mp-info">
            <div class="mp-title" id="mpTitle">—</div>
            <div class="mp-progress-row">
                <div class="mp-progress-wrap" id="mpProgressWrap">
                    <div class="mp-progress-bar" id="mpProgressBar"></div>
                </div>
                <div class="mp-time" id="mpTime">0:00 / 0:00</div>
            </div>
        </div>
        <button class="mp-btn mp-speed" id="mpSpeedBtn" aria-label="播放速度">1x</button>
        <button class="mp-btn mp-close" id="mpCloseBtn" aria-label="关闭"></button>
    </div>

    <script>
        // ========== 全局状态 ==========
        let allAudios = [];          // 每个元素是一个"区"
        let currentZone = -1;        // 当前播放区索引
        let currentTrack = -1;       // 当前播放分集索引
        let openZones = new Set();   // 已展开的区索引
        const audio = new Audio();
        audio.preload = 'none';

        const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
        let speedIndex = 0;

        // ========== DOM 引用 ==========
        const audioListEl = document.getElementById('audioList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const miniPlayer = document.getElementById('miniPlayer');
        const mpCover = document.getElementById('mpCover');
        const mpTitle = document.getElementById('mpTitle');
        const mpProgressWrap = document.getElementById('mpProgressWrap');
        const mpProgressBar = document.getElementById('mpProgressBar');
        const mpTime = document.getElementById('mpTime');
        const mpSpeedBtn = document.getElementById('mpSpeedBtn');
        const mpPlayBtn = document.getElementById('mpPlayBtn');
        const mpCloseBtn = document.getElementById('mpCloseBtn');

        // ========== SVG 图标 ==========
        const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
        const ICON_CLOSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        const ICON_ARROW = '<svg class="zone-arrow" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 6l6 6-6 6z"/></svg>';

        mpPlayBtn.innerHTML = ICON_PLAY;
        mpCloseBtn.innerHTML = ICON_CLOSE;

        // ========== 工具函数 ==========
        function formatTime(sec) {
            if (sec == null || isNaN(sec) || !isFinite(sec) || sec < 0) return '0:00';
            const total = Math.floor(sec);
            const s = total % 60;
            const m = Math.floor(total / 60) % 60;
            const h = Math.floor(total / 3600);
            if (h > 0) {
                return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
            return m + ':' + String(s).padStart(2, '0');
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ========== 数据合并 ==========
        function normalizeData(raw) {
            const defaults = raw.defaults || {};
            const categories = raw.categories || {};
            const audios = raw.audios || [];

            return audios.map(item => {
                const catMeta = categories[item.category] || {};
                return {
                    title: item.title || '',
                    url: item.url || '',
                    category: item.category || '',
                    cover: item.cover || catMeta.cover || defaults.cover || '',
                    tracks: Array.isArray(item.tracks) ? item.tracks : []
                };
            });
        }

        // ========== 加载数据 ==========
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                const raw = await response.json();
                allAudios = normalizeData(raw);
                renderList(allAudios);
                populateCategories(allAudios);
            } catch (error) {
                audioListEl.innerHTML = `<div class="empty-message">⚠️ 数据加载失败，请确保 data.json 与 index.html 在同一目录下。</div>`;
                console.error(error);
            }
        }

        // ========== 渲染列表（区 + 分集） ==========
        function renderList(audios) {
            if (audios.length === 0) {
                audioListEl.innerHTML = `<div class="empty-message">🔍 没有找到匹配的音频</div>`;
                return;
            }

            audioListEl.innerHTML = audios.map((zone, zi) => {
                const idx = allAudios.indexOf(zone);
                const isOpen = openZones.has(idx);
                const tracksHtml = zone.tracks.map((t, ti) => `
                    <div class="track" data-zone="${idx}" data-track="${ti}">
                        <span class="track-index">${ti + 1}</span>
                        <span class="track-title">${escapeHtml(t.title)}</span>
                    </div>
                `).join('');

                return `
                    <div class="zone ${isOpen ? 'open' : ''}" data-zone="${idx}">
                        <div class="zone-header" data-toggle="${idx}">
                            ${ICON_ARROW}
                            <span class="zone-index">${zi + 1}</span>
                            <span class="zone-title">${escapeHtml(zone.title)}</span>
                            ${zone.category ? `<span class="zone-category">${escapeHtml(zone.category)}</span>` : ''}
                            <span class="zone-count">${zone.tracks.length}集</span>
                        </div>
                        <div class="zone-tracks">${tracksHtml}</div>
                    </div>
                `;
            }).join('');

            updateHighlight();
        }

        // ========== 填充分类下拉框 ==========
        function populateCategories(audios) {
            const categories = [...new Set(audios.map(item => item.category).filter(Boolean))];
            categorySelect.innerHTML = '<option value="">全部</option>' +
                categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
        }

        // ========== 搜索 + 分类筛选 ==========
        function applyFilter() {
            const keyword = searchInput.value.toLowerCase().trim();
            const cat = categorySelect.value;

            const filtered = allAudios.filter(zone => {
                const catOk = !cat || zone.category === cat;
                if (!catOk) return false;
                if (!keyword) return true;

                // 区标题匹配
                if (zone.title.toLowerCase().includes(keyword)) return true;
                // 分集标题匹配
                return zone.tracks.some(t => t.title.toLowerCase().includes(keyword));
            });

            // 搜索时自动展开所有匹配的区
            if (keyword) {
                filtered.forEach(zone => openZones.add(allAudios.indexOf(zone)));
            }

            renderList(filtered);
        }

        // ========== 切换展开/折叠 ==========
        function toggleZone(zoneIdx) {
            if (openZones.has(zoneIdx)) {
                openZones.delete(zoneIdx);
            } else {
                openZones.add(zoneIdx);
            }
            const zoneEl = document.querySelector(`.zone[data-zone="${zoneIdx}"]`);
            if (zoneEl) {
                zoneEl.classList.toggle('open', openZones.has(zoneIdx));
            }
        }

        // ========== 卡片高亮 ==========
        function updateHighlight() {
            document.querySelectorAll('.track').forEach(trackEl => {
                const zi = parseInt(trackEl.dataset.zone, 10);
                const ti = parseInt(trackEl.dataset.track, 10);
                trackEl.classList.toggle('playing', zi === currentZone && ti === currentTrack);
            });
        }

        // ========== 播放某一集 ==========
        function playTrack(zoneIdx, trackIdx) {
            const zone = allAudios[zoneIdx];
            if (!zone) return;
            const track = zone.tracks[trackIdx];
            if (!track) return;

            const prevZone = currentZone;
            const prevTrack = currentTrack;

            // 同一条：切换播放/暂停
            if (prevZone === zoneIdx && prevTrack === trackIdx) {
                if (audio.paused) {
                    audio.play().catch(console.error);
                } else {
                    audio.pause();
                }
                return;
            }

            currentZone = zoneIdx;
            currentTrack = trackIdx;

            // 同一个合并文件：直接跳转，不重新加载
            if (prevZone === zoneIdx && audio.duration) {
                audio.currentTime = track.start;
                if (audio.paused) {
                    audio.play().catch(console.error);
                }
                updateMiniPlayer(zone, track);
                updateHighlight();
                return;
            }

            // 不同合并文件：加载新音频
            audio.src = zone.url;
            applySpeed();
            const onLoaded = () => {
                audio.removeEventListener('loadedmetadata', onLoaded);
                audio.currentTime = track.start;
                audio.play().catch(err => {
                    console.error('播放失败:', err);
                    mpTitle.textContent = '播放失败：' + track.title;
                });
            };
            audio.addEventListener('loadedmetadata', onLoaded);
            audio.load();

            updateMiniPlayer(zone, track);
            updateHighlight();
        }

        // ========== 应用倍速 ==========
        function applySpeed() {
            const rate = SPEEDS[speedIndex];
            audio.playbackRate = rate;
            audio.defaultPlaybackRate = rate;
        }

        function updateSpeedBtn() {
            const rate = SPEEDS[speedIndex];
            mpSpeedBtn.textContent = rate + 'x';
            mpSpeedBtn.classList.toggle('active', rate !== 1);
        }

        // ========== 更新迷你播放器 ==========
        function updateMiniPlayer(zone, track) {
            if (zone.cover) {
                mpCover.src = zone.cover;
                mpCover.style.display = '';
            } else {
                mpCover.style.display = 'none';
            }
            mpTitle.textContent = track.title || '—';
            mpProgressBar.style.width = '0%';
            mpTime.textContent = '0:00 / 0:00';
            miniPlayer.classList.add('active');
        }

        // ========== 时长显示（合并文件的总时长） ==========
        function updateTimeDisplay() {
            const cur = formatTime(audio.currentTime);
            const total = (audio.duration && isFinite(audio.duration)) ? formatTime(audio.duration) : '--:--';
            mpTime.textContent = cur + ' / ' + total;
        }

        // ========== 关闭播放器 ==========
        function closePlayer() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            currentZone = -1;
            currentTrack = -1;
            miniPlayer.classList.remove('active');
            updateHighlight();
        }

        // ========== 事件绑定 ==========

        // 点击列表：判断点的是"区头"还是"分集"
        audioListEl.addEventListener('click', (e) => {
            const trackEl = e.target.closest('.track');
            if (trackEl) {
                const zi = parseInt(trackEl.dataset.zone, 10);
                const ti = parseInt(trackEl.dataset.track, 10);
                playTrack(zi, ti);
                return;
            }

            const headerEl = e.target.closest('.zone-header');
            if (headerEl) {
                const zi = parseInt(headerEl.dataset.toggle, 10);
                toggleZone(zi);
            }
        });

        mpPlayBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play().catch(console.error);
            } else {
                audio.pause();
            }
        });

        mpCloseBtn.addEventListener('click', closePlayer);

        mpSpeedBtn.addEventListener('click', () => {
            speedIndex = (speedIndex + 1) % SPEEDS.length;
            applySpeed();
            updateSpeedBtn();
        });

        // 点击进度条：在合并文件内跳转，并自动同步当前分集
        mpProgressWrap.addEventListener('click', (e) => {
            if (!audio.duration || !isFinite(audio.duration)) return;
            const rect = mpProgressWrap.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const newTime = pct * audio.duration;

            // 找到 newTime 落在哪一集
            if (currentZone >= 0) {
                const zone = allAudios[currentZone];
                const ti = zone.tracks.findIndex(t => newTime >= t.start && newTime < t.end);
                if (ti >= 0) {
                    currentTrack = ti;
                    updateMiniPlayer(zone, zone.tracks[ti]);
                    updateHighlight();
                }
            }
            audio.currentTime = newTime;
        });

        audio.addEventListener('play', () => {
            mpPlayBtn.innerHTML = ICON_PAUSE;
        });

        audio.addEventListener('pause', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
        });

        audio.addEventListener('timeupdate', () => {
            // 进度条 + 时间
            if (audio.duration && isFinite(audio.duration)) {
                const pct = (audio.currentTime / audio.duration) * 100;
                mpProgressBar.style.width = pct + '%';
            }
            updateTimeDisplay();

            // 自动切换分集
            if (currentZone >= 0 && currentTrack >= 0 && !audio.paused) {
                const zone = allAudios[currentZone];
                const track = zone.tracks[currentTrack];
                if (track && audio.currentTime >= track.end) {
                    // 播放下一集
                    if (currentTrack + 1 < zone.tracks.length) {
                        playTrack(currentZone, currentTrack + 1);
                    } else {
                        // 本区最后一集：暂停
                        audio.pause();
                        audio.currentTime = track.end;
                    }
                }
            }
        });

        audio.addEventListener('loadedmetadata', updateTimeDisplay);
        audio.addEventListener('durationchange', updateTimeDisplay);

        audio.addEventListener('ended', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
            mpProgressBar.style.width = '0%';
        });

        audio.addEventListener('error', () => {
            console.error('音频加载失败');
            mpTime.textContent = '0:00 / --:--';
        });

        searchInput.addEventListener('input', applyFilter);
        categorySelect.addEventListener('change', applyFilter);

        updateSpeedBtn();
        loadData();
    </script>
</body>
</html>
