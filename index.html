<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>我的音频分享站</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* ========== 头部（极简） ========== */
        header {
            margin-bottom: 12px;
            text-align: center;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        header p {
            display: none; /* 小屏隐藏副标题，节省空间；需要可改为 block */
        }

        /* ========== 控制栏 ========== */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            font-family: inherit;
            transition: border-color 0.15s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .category-select {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            cursor: pointer;
            min-width: 110px;
            font-family: inherit;
            color: var(--text);
        }

        .category-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ========== 列表 ========== */
        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 卡片：左侧缩略图 + 右侧信息，横向紧凑布局 */
        .audio-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: box-shadow 0.15s;
        }

        @media (hover: hover) {
            .audio-card:hover {
                box-shadow: var(--shadow-hover);
            }
        }

        /* 封面：正方形缩略图，居中裁剪 */
        .audio-cover {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            object-position: center;
            flex-shrink: 0;
            background: #f1f5f9;
            display: block;
        }

        .audio-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* 标题 + 分类 同一行 */
        .audio-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .audio-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .audio-category {
            font-size: 0.7rem;
            font-weight: 500;
            background: #eef2ff;
            color: var(--primary);
            padding: 1px 8px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 描述：单行截断 */
        .audio-description {
            color: var(--text-light);
            font-size: 0.78rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 音频控件：紧凑高度 */
        audio {
            width: 100%;
            height: 34px;
            margin-top: 2px;
            display: block;
        }

        /* ========== 空状态 ========== */
        .empty-message {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-light);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
            font-size: 0.9rem;
        }

        /* ============================================================
           桌面端（>= 700px）：稍微放大一点，但依然紧凑
           ============================================================ */
        @media (min-width: 700px) {
            body {
                padding: 20px;
            }

            header {
                margin-bottom: 18px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            header p {
                display: block;
                color: var(--text-light);
                font-size: 0.9rem;
                margin-top: 2px;
            }

            .controls {
                margin-bottom: 16px;
                gap: 10px;
            }

            .search-box,
            .category-select {
                padding: 9px 14px;
                font-size: 0.95rem;
            }

            .audio-list {
                gap: 10px;
            }

            .audio-card {
                padding: 12px;
                gap: 14px;
                border-radius: 12px;
            }

            .audio-cover {
                width: 72px;
                height: 72px;
                border-radius: 10px;
            }

            .audio-title {
                font-size: 1.05rem;
            }

            .audio-description {
                font-size: 0.85rem;
                margin-top: 2px;
            }

            audio {
                height: 38px;
                margin-top: 4px;
            }
        }

        /* ============================================================
           大屏（>= 1200px）：容器放宽，卡片信息更舒展
           ============================================================ */
        @media (min-width: 1200px) {
            .container {
                max-width: 1000px;
            }

            .audio-cover {
                width: 80px;
                height: 80px;
            }

            .audio-card {
                padding: 14px 16px;
            }
        }

        /* ============================================================
           超小屏（<= 360px）：进一步收缩
           ============================================================ */
        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .audio-cover {
                width: 48px;
                height: 48px;
            }

            .audio-card {
                padding: 8px;
                gap: 8px;
            }

            .audio-title {
                font-size: 0.88rem;
            }

            audio {
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎧 我的声音作品</h1>
            <p>个人音频分享 · 纯净聆听 · 无需登录</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索..." inputmode="search">
            <select id="categorySelect" class="category-select">
                <option value="">全部</option>
            </select>
        </div>

        <div id="audioList" class="audio-list">
            <!-- 动态渲染 -->
        </div>
    </div>

    <script>
        let allAudios = [];
        const audioListEl = document.getElementById('audioList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                allAudios = await response.json();
                renderAudios(allAudios);
                populateCategories(allAudios);
            } catch (error) {
                audioListEl.innerHTML = `<div class="empty-message">⚠️ 数据加载失败，请确保 data.json 与 index.html 在同一目录下。</div>`;
                console.error(error);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderAudios(audios) {
            if (audios.length === 0) {
                audioListEl.innerHTML = `<div class="empty-message">🔍 没有找到匹配的音频</div>`;
                return;
            }

            audioListEl.innerHTML = audios.map(audio => `
                <div class="audio-card">
                    ${audio.cover ? `<img class="audio-cover" src="${escapeHtml(audio.cover)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <div class="audio-info">
                        <div class="audio-title-row">
                            <div class="audio-title">${escapeHtml(audio.title)}</div>
                            ${audio.category ? `<span class="audio-category">${escapeHtml(audio.category)}</span>` : ''}
                        </div>
                        ${audio.description ? `<div class="audio-description">${escapeHtml(audio.description)}</div>` : ''}
                        <audio controls preload="none" src="${escapeHtml(audio.url)}"></audio>
                    </div>
                </div>
            `).join('');
        }

        function populateCategories(audios) {
            const categories = [...new Set(audios.map(item => item.category).filter(Boolean))];
            categorySelect.innerHTML = '<option value="">全部</option>' +
                categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
        }

        function applyFilter() {
            const keyword = searchInput.value.toLowerCase().trim();
            const cat = categorySelect.value;

            const filtered = allAudios.filter(audio => {
                const titleMatch = audio.title.toLowerCase().includes(keyword);
                const descMatch = audio.description ? audio.description.toLowerCase().includes(keyword) : false;
                const keywordOk = !keyword || titleMatch || descMatch;
                const catOk = !cat || audio.category === cat;
                return keywordOk && catOk;
            });

            renderAudios(filtered);
        }

        searchInput.addEventListener('input', applyFilter);
        categorySelect.addEventListener('change', applyFilter);

        loadData();
    </script>
</body>
</html>
