<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音频分享站</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .category-select {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            cursor: pointer;
            min-width: 150px;
        }

        .category-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .audio-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .audio-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .audio-cover {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f1f5f9;
        }

        .audio-info {
            flex: 1;
            min-width: 0;
        }

        .audio-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }

        .audio-description {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .audio-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            background: #eef2ff;
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }

        @media (max-width: 600px) {
            .audio-card {
                flex-direction: column;
            }
            .audio-cover {
                width: 100%;
                height: 160px;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎧 我的声音作品</h1>
            <p>个人音频分享 · 纯净聆听 · 无需登录</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索音频标题或描述...">
            <select id="categorySelect" class="category-select">
                <option value="">全部分类</option>
            </select>
        </div>

        <div id="audioList" class="audio-list">
            <!-- 动态渲染 -->
        </div>
    </div>

    <script>
        let allAudios = [];
        const audioListEl = document.getElementById('audioList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');

        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                allAudios = await response.json();
                renderAudios(allAudios);
                populateCategories(allAudios);
            } catch (error) {
                audioListEl.innerHTML = `<div class="empty-message">⚠️ 数据加载失败，请确保 data.json 文件与 index.html 在同一目录下。</div>`;
                console.error('加载数据出错:', error);
            }
        }

        // 渲染音频列表
        function renderAudios(audios) {
            if (audios.length === 0) {
                audioListEl.innerHTML = `<div class="empty-message">🔍 没有找到匹配的音频</div>`;
                return;
            }

            audioListEl.innerHTML = audios.map(audio => `
                <div class="audio-card">
                    ${audio.cover ? `<img class="audio-cover" src="${audio.cover}" alt="${audio.title} 封面" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <div class="audio-info">
                        <div class="audio-title">${audio.title}</div>
                        ${audio.category ? `<span class="audio-category">${audio.category}</span>` : ''}
                        ${audio.description ? `<p class="audio-description">${audio.description}</p>` : ''}
                        <audio controls preload="none" src="${audio.url}"></audio>
                    </div>
                </div>
            `).join('');
        }

        // 填充分类下拉框
        function populateCategories(audios) {
            const categories = [...new Set(audios.map(item => item.category).filter(Boolean))];
            categorySelect.innerHTML = '<option value="">全部分类</option>' +
                categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        // 搜索事件
        searchInput.addEventListener('input', function() {
            const keyword = this.value.toLowerCase().trim();
            const filtered = allAudios.filter(audio => {
                const titleMatch = audio.title.toLowerCase().includes(keyword);
                const descMatch = audio.description ? audio.description.toLowerCase().includes(keyword) : false;
                return titleMatch || descMatch;
            });
            renderAudios(filtered);
        });

        // 分类筛选事件
        categorySelect.addEventListener('change', function() {
            const cat = this.value;
            const filtered = cat ? allAudios.filter(audio => audio.category === cat) : allAudios;
            renderAudios(filtered);
        });

        // 启动
        loadData();
    </script>
</body>
</html>
