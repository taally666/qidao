<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>我的音频分享站</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
            --radius: 8px;
            --row-h: 44px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            padding-bottom: calc(12px + 68px + env(safe-area-inset-bottom, 0px));
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* ========== 头部 ========== */
        header {
            margin-bottom: 10px;
            text-align: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        /* ========== 控制栏 ========== */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .search-box:focus { outline: none; border-color: var(--primary); }

        .category-select {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            cursor: pointer;
            min-width: 96px;
            font-family: inherit;
            color: var(--text);
        }
        .category-select:focus { outline: none; border-color: var(--primary); }

        /* ========== 列表：纯文本行 ========== */
        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audio-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            height: var(--row-h);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
            user-select: none;
        }

        .audio-card:hover { background: #f8fafc; }

        .audio-card.playing {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .audio-index {
            flex-shrink: 0;
            width: 24px;
            font-size: 0.78rem;
            color: var(--text-light);
            text-align: right;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .audio-card.playing .audio-index {
            color: var(--primary);
            font-weight: 600;
        }

        .audio-title {
            flex: 1;
            min-width: 0;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .audio-card.playing .audio-title {
            color: var(--primary);
            font-weight: 600;
        }

        .audio-category {
            flex-shrink: 0;
            font-size: 0.72rem;
            color: var(--text-light);
            white-space: nowrap;
        }

        .audio-card.playing .audio-category {
            color: var(--primary);
        }

        /* ========== 空状态 ========== */
        .empty-message {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-light);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
            font-size: 0.9rem;
        }

        /* ========== 底部迷你播放器 ========== */
        .mini-player {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
            background: #ffffff;
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(110%);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .mini-player.active { transform: translateY(0); }

        .mp-cover {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            object-position: center;
            flex-shrink: 0;
            background: #f1f5f9;
            display: block;
        }

        .mp-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mp-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 进度条行：进度条 + 时长 */
        .mp-progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .mp-progress-wrap {
            flex: 1;
            min-width: 0;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .mp-progress-wrap::before {
            content: '';
            position: absolute;
            top: -10px; bottom: -10px;
            left: 0; right: 0;
        }

        .mp-progress-bar {
            height: 100%;
            width: 0;
            background: var(--primary);
            border-radius: 2px;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        /* 时长：等宽数字，不换行 */
        .mp-time {
            flex-shrink: 0;
            font-size: 0.68rem;
            color: var(--text-light);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            line-height: 1;
        }

        /* 通用按钮 */
        .mp-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s, color 0.15s;
        }

        .mp-btn:hover { background: #f1f5f9; }

        .mp-play {
            background: var(--primary);
            color: #fff;
        }
        .mp-play:hover { background: #4338ca; }

        .mp-close { color: var(--text-light); }

        /* 倍速按钮：显示文字，宽度自适应 */
        .mp-speed {
            width: auto;
            min-width: 40px;
            height: 36px;
            padding: 0 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-light);
            font-variant-numeric: tabular-nums;
        }

        .mp-speed:hover {
            color: var(--primary);
        }

        /* 非 1x 时高亮 */
        .mp-speed.active {
            color: var(--primary);
            background: #eef2ff;
        }

        /* ========== 桌面端 ========== */
        @media (min-width: 700px) {
            :root {
                --row-h: 48px;
            }

            body {
                padding: 20px;
                padding-bottom: calc(20px + 76px);
            }

            header { margin-bottom: 14px; }
            header h1 { font-size: 1.4rem; }

            .controls {
                margin-bottom: 10px;
                gap: 10px;
            }

            .search-box,
            .category-select {
                padding: 9px 14px;
                font-size: 0.95rem;
            }

            .audio-list { gap: 6px; }

            .audio-card {
                padding: 0 16px;
                gap: 14px;
            }

            .audio-index {
                width: 30px;
                font-size: 0.82rem;
            }

            .audio-title { font-size: 1rem; }
            .audio-category { font-size: 0.78rem; }

            .mini-player {
                padding: 10px 20px;
                gap: 14px;
                padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
            }

            .mp-cover {
                width: 44px;
                height: 44px;
            }

            .mp-title { font-size: 0.92rem; }

            .mp-time { font-size: 0.72rem; }

            .mp-btn {
                width: 40px;
                height: 40px;
            }

            .mp-speed {
                min-width: 44px;
                height: 40px;
                font-size: 0.82rem;
            }
        }

        /* ========== 大屏 ========== */
        @media (min-width: 1200px) {
            .container { max-width: 1000px; }
        }

        /* ========== 超小屏 ========== */
        @media (max-width: 360px) {
            :root {
                --row-h: 40px;
            }

            body { padding: 10px; padding-bottom: calc(10px + 64px); }

            .audio-card {
                padding: 0 10px;
                gap: 8px;
            }

            .audio-title { font-size: 0.85rem; }
            .audio-category { font-size: 0.68rem; }

            .mp-cover {
                width: 34px;
                height: 34px;
            }

            .mp-time { font-size: 0.62rem; }

            .mp-btn {
                width: 32px;
                height: 32px;
            }

            .mp-speed {
                min-width: 36px;
                height: 32px;
                padding: 0 6px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎧 我的声音作品</h1>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索..." inputmode="search">
            <select id="categorySelect" class="category-select">
                <option value="">全部</option>
            </select>
        </div>

        <div id="audioList" class="audio-list"></div>
    </div>

    <!-- 底部迷你播放器 -->
    <div class="mini-player" id="miniPlayer">
        <img class="mp-cover" id="mpCover" src="" alt="">
        <div class="mp-info">
            <div class="mp-title" id="mpTitle">—</div>
            <div class="mp-progress-row">
                <div class="mp-progress-wrap" id="mpProgressWrap">
                    <div class="mp-progress-bar" id="mpProgressBar"></div>
                </div>
                <div class="mp-time" id="mpTime">0:00 / 0:00</div>
            </div>
        </div>
        <button class="mp-btn mp-speed" id="mpSpeedBtn" aria-label="播放速度">1x</button>
        <button class="mp-btn mp-play" id="mpPlayBtn" aria-label="播放/暂停"></button>
        <button class="mp-btn mp-close" id="mpCloseBtn" aria-label="关闭"></button>
    </div>

    <script>
        // ========== 全局状态 ==========
        let allAudios = [];
        let currentIndex = -1;
        const audio = new Audio();
        audio.preload = 'none';

        // 播放速度循环列表
        const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
        let speedIndex = 0;

        // ========== DOM 引用 ==========
        const audioListEl = document.getElementById('audioList');
        const searchInput = document.getElementById('searchInput');
        const categorySelect = document.getElementById('categorySelect');
        const miniPlayer = document.getElementById('miniPlayer');
        const mpCover = document.getElementById('mpCover');
        const mpTitle = document.getElementById('mpTitle');
        const mpProgressWrap = document.getElementById('mpProgressWrap');
        const mpProgressBar = document.getElementById('mpProgressBar');
        const mpTime = document.getElementById('mpTime');
        const mpSpeedBtn = document.getElementById('mpSpeedBtn');
        const mpPlayBtn = document.getElementById('mpPlayBtn');
        const mpCloseBtn = document.getElementById('mpCloseBtn');

        // ========== SVG 图标 ==========
        const ICON_PLAY = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
        const ICON_CLOSE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

        mpPlayBtn.innerHTML = ICON_PLAY;
        mpCloseBtn.innerHTML = ICON_CLOSE;

        // ========== 工具函数 ==========
        // 时间格式化：秒 → m:ss 或 h:mm:ss
        function formatTime(sec) {
            if (sec == null || isNaN(sec) || !isFinite(sec) || sec < 0) return '0:00';
            const total = Math.floor(sec);
            const s = total % 60;
            const m = Math.floor(total / 60) % 60;
            const h = Math.floor(total / 3600);
            if (h > 0) {
                return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
            return m + ':' + String(s).padStart(2, '0');
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ========== 数据合并 ==========
        function normalizeData(raw) {
            const defaults = raw.defaults || {};
            const categories = raw.categories || {};
            const audios = raw.audios || [];

            return audios.map(item => {
                const catMeta = categories[item.category] || {};
                return {
                    title: item.title || '',
                    url: item.url || '',
                    category: item.category || '',
                    cover: item.cover || catMeta.cover || defaults.cover || ''
                };
            });
        }

        // ========== 加载数据 ==========
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                const raw = await response.json();
                allAudios = normalizeData(raw);
                renderAudios(allAudios);
                populateCategories(allAudios);
            } catch (error) {
                audioListEl.innerHTML = `<div class="empty-message">⚠️ 数据加载失败，请确保 data.json 与 index.html 在同一目录下。</div>`;
                console.error(error);
            }
        }

        // ========== 渲染列表 ==========
        function renderAudios(audios) {
            if (audios.length === 0) {
                audioListEl.innerHTML = `<div class="empty-message">🔍 没有找到匹配的音频</div>`;
                return;
            }

            audioListEl.innerHTML = audios.map((item, i) => {
                const idx = allAudios.indexOf(item);
                return `
                    <div class="audio-card" data-idx="${idx}">
                        <span class="audio-index">${i + 1}</span>
                        <div class="audio-title">${escapeHtml(item.title)}</div>
                        ${item.category ? `<span class="audio-category">${escapeHtml(item.category)}</span>` : ''}
                    </div>
                `;
            }).join('');

            updateCardHighlight();
        }

        // ========== 填充分类下拉框 ==========
        function populateCategories(audios) {
            const categories = [...new Set(audios.map(item => item.category).filter(Boolean))];
            categorySelect.innerHTML = '<option value="">全部</option>' +
                categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
        }

        // ========== 搜索 + 分类筛选 ==========
        function applyFilter() {
            const keyword = searchInput.value.toLowerCase().trim();
            const cat = categorySelect.value;

            const filtered = allAudios.filter(item => {
                const titleMatch = item.title.toLowerCase().includes(keyword);
                const catOk = !cat || item.category === cat;
                const keywordOk = !keyword || titleMatch;
                return keywordOk && catOk;
            });

            renderAudios(filtered);
        }

        // ========== 卡片高亮 ==========
        function updateCardHighlight() {
            document.querySelectorAll('.audio-card').forEach(card => {
                const idx = parseInt(card.dataset.idx, 10);
                card.classList.toggle('playing', idx === currentIndex);
            });
        }

        // ========== 切换播放 ==========
        function togglePlay(idx) {
            const item = allAudios[idx];
            if (!item) return;

            if (idx === currentIndex) {
                if (audio.paused) {
                    audio.play().catch(console.error);
                } else {
                    audio.pause();
                }
                return;
            }

            currentIndex = idx;
            audio.src = item.url;
            // 设置 src 后 playbackRate 会重置为 defaultPlaybackRate，这里保持当前倍速
            applySpeed();
            audio.play().catch(err => {
                console.error('播放失败:', err);
                mpTitle.textContent = '播放失败：' + item.title;
            });
            updateMiniPlayer(item);
            updateCardHighlight();
        }

        // ========== 应用当前倍速 ==========
        function applySpeed() {
            const rate = SPEEDS[speedIndex];
            audio.playbackRate = rate;
            audio.defaultPlaybackRate = rate;
        }

        // ========== 更新倍速按钮 ==========
        function updateSpeedBtn() {
            const rate = SPEEDS[speedIndex];
            mpSpeedBtn.textContent = rate + 'x';
            mpSpeedBtn.classList.toggle('active', rate !== 1);
        }

        // ========== 更新迷你播放器 ==========
        function updateMiniPlayer(item) {
            if (item.cover) {
                mpCover.src = item.cover;
                mpCover.style.display = '';
            } else {
                mpCover.style.display = 'none';
            }
            mpTitle.textContent = item.title || '—';
            mpProgressBar.style.width = '0%';
            mpTime.textContent = '0:00 / 0:00';
            miniPlayer.classList.add('active');
        }

        // ========== 时长显示 ==========
        function updateTimeDisplay() {
            const cur = formatTime(audio.currentTime);
            const total = (audio.duration && isFinite(audio.duration)) ? formatTime(audio.duration) : '--:--';
            mpTime.textContent = cur + ' / ' + total;
        }

        // ========== 关闭播放器 ==========
        function closePlayer() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            currentIndex = -1;
            miniPlayer.classList.remove('active');
            updateCardHighlight();
        }

        // ========== 事件绑定 ==========
        audioListEl.addEventListener('click', (e) => {
            const card = e.target.closest('.audio-card');
            if (!card) return;
            const idx = parseInt(card.dataset.idx, 10);
            togglePlay(idx);
        });

        mpPlayBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play().catch(console.error);
            } else {
                audio.pause();
            }
        });

        mpCloseBtn.addEventListener('click', closePlayer);

        // 倍速按钮：循环切换
        mpSpeedBtn.addEventListener('click', () => {
            speedIndex = (speedIndex + 1) % SPEEDS.length;
            applySpeed();
            updateSpeedBtn();
        });

        // 进度条点击跳转
        mpProgressWrap.addEventListener('click', (e) => {
            if (!audio.duration || !isFinite(audio.duration)) return;
            const rect = mpProgressWrap.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = pct * audio.duration;
        });

        // 音频事件
        audio.addEventListener('play', () => {
            mpPlayBtn.innerHTML = ICON_PAUSE;
        });

        audio.addEventListener('pause', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && isFinite(audio.duration)) {
                const pct = (audio.currentTime / audio.duration) * 100;
                mpProgressBar.style.width = pct + '%';
            }
            updateTimeDisplay();
        });

        audio.addEventListener('loadedmetadata', () => {
            updateTimeDisplay();
        });

        audio.addEventListener('durationchange', () => {
            updateTimeDisplay();
        });

        audio.addEventListener('ended', () => {
            mpPlayBtn.innerHTML = ICON_PLAY;
            mpProgressBar.style.width = '0%';
        });

        audio.addEventListener('error', () => {
            console.error('音频加载失败');
            mpTime.textContent = '0:00 / --:--';
        });

        // 搜索和分类
        searchInput.addEventListener('input', applyFilter);
        categorySelect.addEventListener('change', applyFilter);

        // 初始化
        updateSpeedBtn();
        loadData();
    </script>
</body>
</html>
