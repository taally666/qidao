<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>转载奇刀君</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <button class="header-back" id="headerBackBtn" aria-label="返回" style="display:none"></button>
            <h1 id="headerTitle">转载奇刀君</h1>
            <button class="header-manager" id="headerManagerBtn" aria-label="缓存管理"></button>
        </header>

        <div class="controls" id="controlsBar">
            <input type="text" id="searchInput" class="search-box" placeholder="搜索..." inputmode="search">
        </div>

        <div id="mainView"></div>
    </div>

    <!-- 底部迷你播放器 -->
    <div class="mini-player" id="miniPlayer">
        <img class="mp-cover" id="mpCover" src="" alt="">
        <button class="mp-btn mp-play" id="mpPlayBtn" aria-label="播放/暂停"></button>
        <div class="mp-title" id="mpTitle">
            <span class="mp-title-inner" id="mpTitleInner">—</span>
        </div>
        <button class="mp-btn mp-skip mp-skip-desktop" data-skip="-15" aria-label="后退15秒">-15</button>
        <button class="mp-btn mp-skip mp-skip-desktop" data-skip="15" aria-label="前进15秒">+15</button>
        <button class="mp-btn mp-speed" id="mpSpeedBtn" aria-label="播放速度">1x</button>
        <button class="mp-btn mp-cache" id="mpCacheBtn" aria-label="缓存本 part"></button>
        <button class="mp-btn mp-close" id="mpCloseBtn" aria-label="关闭"></button>
        <div class="mp-progress-row">
            <button class="mp-btn mp-skip mp-skip-mobile" data-skip="-15" aria-label="后退15秒">-15</button>
            <div class="mp-progress-wrap" id="mpProgressWrap">
                <div class="mp-progress-bar" id="mpProgressBar"></div>
            </div>
            <div class="mp-time" id="mpTime">0:00 / 0:00</div>
            <button class="mp-btn mp-skip mp-skip-mobile" data-skip="15" aria-label="前进15秒">+15</button>
        </div>
    </div>

    <!-- 缓存管理弹层 -->
    <div class="manager-mask" id="managerMask"></div>
    <div class="manager" id="manager">
        <div class="manager-header">
            <h2>缓存管理</h2>
            <button class="manager-close" id="managerCloseBtn" aria-label="关闭"></button>
        </div>
        <div class="manager-body" id="managerBody"></div>
        <div class="manager-footer" id="managerFooter"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
